@media screen and (prefers-reduced-motion: no-preference) {
  :root { --ease-settle: cubic-bezier(.2,.75,.25,1); }
  header { transition: transform 200ms var(--ease-settle), opacity 160ms ease; }
  button { transition: background-color 160ms ease, transform 150ms var(--ease-settle); }
  .menu, .submenu, dialog[open] { animation: surface-enter 170ms var(--ease-settle) both; }
  .menu { transform-origin: top right; }
  .submenu { transform-origin: center; }
  dialog[open]::backdrop { animation: fade-enter 160ms ease both; }
  .float {
    animation: surface-enter 150ms var(--ease-settle) both;
    transition: left 150ms var(--ease-settle), top 150ms var(--ease-settle);
  }
  main > article { animation: document-enter 190ms var(--ease-settle) both; }
}
@keyframes surface-enter {
  from { opacity: 0; transform: translateY(3px) scale(.99); }
  to { opacity: 1; transform: none; }
}
@keyframes document-enter {
  from { opacity: .65; transform: translateY(3px); }
  to { opacity: 1; transform: none; }
}
@keyframes fade-enter { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
@media screen and (prefers-reduced-motion: no-preference) {
  .save[data-saved="true"] svg { animation: saved-confirm 200ms ease-out both; }
  .menu:not(:has(.menu-heading)) { animation: submenu-enter 160ms var(--ease-settle) both; }
}
@keyframes saved-confirm {
  from { opacity: .55; transform: scale(.9); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes submenu-enter {
  from { opacity: .5; transform: translateX(-4px); }
  to { opacity: 1; transform: none; }
}
